# TP-Link WTA301 -- 256 MiB board, two ath11k radios.
#
# OpenWrt's /etc/init.d/sysctl raises vm.min_free_kbytes to 16384 as soon as
# MemTotal > 65536 kB.  On this board that reserves 16 MiB of RAM that nothing
# ever uses: measured MemAvailable 5468 kB with 16384, 25756 kB with 4096 --
# i.e. the setting alone costs ~20 MiB of usable memory on an idle router.
#
# The stock TP-Link firmware never raises it, and the previously validated
# build of this board (openwrt snapshot r37669, kernel 6.18.55) ships this very
# file with the value below (byte-identical /etc/init.d/sysctl md5
# 573dc001... on both, so the difference is this file, not the init script).
#
# 4096 kB is the kernel/OpenWrt default for small systems; with 89 MiB of zram
# swap present there is no reason to hold 16 MiB pinned.
#
# See wta301-2512/docs/P14-MEMORY-THREE-WAY.md
vm.min_free_kbytes = 4096
