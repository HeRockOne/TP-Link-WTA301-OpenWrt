# WTA301 —— 网络性能内核参数（固件内置，开箱即用）
#
# 依据：docs/R20-PERF-EXTERNAL-EVIDENCE.md
# 与 /usr/sbin/net-tune 的分工：本文件是「声明式基线」，net-tune 是
# 「IRQ 亲和性的看护者」（IRQ 号每次启动会变，sysctl 管不了）。两者幂等。

# ── netdev_budget ─────────────────────────────────────────────────────
# RedHat 官方判据（tuning-the-network-performance 33.2.5）：
#   「If softirqd processes could not retrieve all packets from interfaces in one
#     NAPI polling cycle, it is an indicator that the SoftIRQs do not have enough
#     CPU time. … you can control the time and number of packets softirqd can
#     process in a polling cycle [by raising net.core.netdev_budget]」
#   判据取 /proc/net/softnet_stat 第三列；「If the counters in the third column …
#   increment over time, tune the system.」
#
# 本板出厂状态实测（软重启后）：
#   CPU0 第三列 = 0x27b8 = 10168
#   CPU1 第三列 = 0x050d = 1293
# ⇒ 按官方判据应当提高。默认 300 → 1000。
net.core.netdev_budget = 1000

# ── rps_sock_flow_entries ─────────────────────────────────────────────
# 与 packet_steering 的 steering_flows（uci-defaults/99-wta301-net 设 4096）
# 配套：前者是「每个 rx 队列的 flow 数」，后者是「全局 socket flow 表大小」。
# 两者不等会导致哈希冲突退化。
net.core.rps_sock_flow_entries = 4096
